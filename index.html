/* Saloon Play Modal */
.saloon-modal {
  position: relative;
  overflow: hidden;
  text-align: center;
  background:
    radial-gradient(circle at center, rgba(255,247,237,.96), rgba(254,215,170,.96)),
    linear-gradient(135deg,#fff7ed,#fed7aa);
}

.saloon-modal:before,
.saloon-modal:after {
  content: "";
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;
  background:
    linear-gradient(90deg, rgba(59,29,11,.92), rgba(124,45,18,.86)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 18px);
  border: 4px solid #3b1d0b;
  z-index: 0;
  animation-duration: .7s;
  animation-fill-mode: forwards;
  animation-timing-function: ease-out;
}

.saloon-modal:before {
  left: 0;
  transform-origin: left center;
  animation-name: saloonLeft;
}

.saloon-modal:after {
  right: 0;
  transform-origin: right center;
  animation-name: saloonRight;
}

.saloon-content {
  position: relative;
  z-index: 2;
  padding: 12px;
}

.saloon-sign {
  display: inline-block;
  background: #7c2d12;
  color: #fff7ed;
  border: 3px dashed #f2c078;
  border-radius: 18px;
  padding: 12px 22px;
  font-weight: 950;
  letter-spacing: 2px;
  text-transform: uppercase;
  box-shadow: 0 10px 24px rgba(59,29,11,.28);
  margin-bottom: 16px;
}

.saloon-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 24px 0 14px;
}

.saloon-action {
  min-height: 145px;
  border-radius: 24px;
  font-size: 18px;
  white-space: normal;
}

.saloon-action span {
  display: block;
  font-size: 42px;
  margin-bottom: 8px;
}

@keyframes saloonLeft {
  0% { transform: perspective(800px) rotateY(0deg); opacity: 1; }
  100% { transform: perspective(800px) rotateY(-72deg); opacity: .18; }
}

@keyframes saloonRight {
  0% { transform: perspective(800px) rotateY(0deg); opacity: 1; }
  100% { transform: perspective(800px) rotateY(72deg); opacity: .18; }
}

@media(max-width:700px){
  .saloon-actions { grid-template-columns: 1fr; }
  .saloon-action { min-height: 115px; }
}

.recognition-form input{border:2px solid rgba(139,69,19,.35);border-radius:16px;padding:14px 16px;font-size:16px;font-weight:800;background:#fff7ed;width:100%}

n": "Suspension or termination", "fundamento": "Chapter Five – 40: Workers must follow instructions issued by the Safety and Hygiene Commission."}}, "uid": "height_4"}, {"id": "spill", "category": "Ambiental / derrames", "rule": "Regla 5: Prevenga emisiones, derrames o contaminantes", "severity": "Alto", "visual": "spill", "es": {"title": "¿Qué acción es correcta ante un derrame en piso?", "text": "Se derrama líquido en un área de tránsito y una persona cree que puede limpiarlo sin reportarlo.", "correct": "Reportar, señalizar y seguir el procedimiento aplicable", "options": ["Reportar, señalizar y seguir el procedimiento aplicable", "Limpiarlo en silencio para evitar problemas", "Esperar a ver si alguien más lo reporta"], "explanation": "Todo derrame debe reportarse y señalizarse inmediatamente.", "impact": "Un derrame no señalizado puede provocar caídas, exposición química o contaminación ambiental.", "rit": {"conducta": "No reportar o señalizar inmediatamente derrames", "sancion": "Llamada de Atención (Gradual) o suspensión", "fundamento": "Capítulo Séptimo – 65: Incumplimiento a procedimientos de calidad y ambiental puede generar sanciones según gravedad."}}, "en": {"title": "What is the correct action when there is a spill on the floor?", "text": "A liquid spills in a traffic area and someone thinks they can clean it up without reporting it.", "correct": "Report it, mark the area, and follow the applicable procedure", "options": ["Report it, mark the area, and follow the applicable procedure", "Clean it quietly to avoid problems", "Wait to see if someone else reports it"], "explanation": "Every spill must be reported and marked immediately.", "impact": "An unmarked spill can cause falls, chemical exposure, or environmental contamination.", "rit": {"conducta": "Not immediately reporting or marking spills", "sancion": "Progressive warning or suspension", "fundamento": "Chapter Seven – 65: Noncompliance with quality and environmental procedures may result in sanctions depending on severity."}}, "uid": "spill_5"}, {"id": "procedure", "category": "Procedimientos / entrenamiento", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Alto", "visual": "procedure", "es": {"title": "¿Cuál es el riesgo de modificar un procedimiento sin autorización?", "text": "Un operador cambia un paso del procedimiento porque considera que ahorra tiempo.", "correct": "Puede generar una desviación, un riesgo de seguridad o un incumplimiento", "options": ["Puede generar una desviación, un riesgo de seguridad o un incumplimiento", "No pasa nada si el resultado final es el mismo", "Es aceptable si la persona tiene experiencia"], "explanation": "Los cambios deben validarse formalmente. La experiencia no autoriza modificar procedimientos por cuenta propia.", "impact": "Un cambio no validado puede generar errores de proceso, desviaciones, riesgos de seguridad o hallazgos de auditoría.", "rit": {"conducta": "Modificar procedimientos sin autorización", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Quinto – 37: Abstenerse de actos que pongan en peligro la seguridad o instalaciones."}}, "en": {"title": "What is the risk of modifying a procedure without authorization?", "text": "An operator changes one procedure step because they believe it saves time.", "correct": "It can create a deviation, safety risk, or compliance issue", "options": ["It can create a deviation, safety risk, or compliance issue", "Nothing happens if the final result is the same", "It is acceptable if the person has experience"], "explanation": "Changes must be formally validated. Experience does not authorize changing procedures independently.", "impact": "An unvalidated change can cause process errors, deviations, safety risks, or audit findings.", "rit": {"conducta": "Changing procedures without authorization", "sancion": "Suspension or termination", "fundamento": "Chapter Five – 37: Refrain from acts that may endanger safety or facilities."}}, "uid": "procedure_6"}, {"id": "panel", "category": "Dispositivos / equipo restringido", "rule": "Regla 2: Utilice siempre los dispositivos de seguridad", "severity": "Alto", "visual": "panel", "es": {"title": "¿Quién debe intervenir un tablero eléctrico marcado como solo personal autorizado?", "text": "Un colaborador intenta reiniciar un equipo abriendo un tablero restringido.", "correct": "Únicamente personal autorizado y competente", "options": ["Únicamente personal autorizado y competente", "Cualquier líder de área", "Cualquier persona si el equipo está detenido"], "explanation": "Los tableros restringidos no deben ser operados por personal no autorizado.", "impact": "Intervenir tableros sin autorización puede provocar choque eléctrico, arco eléctrico o quemaduras.", "rit": {"conducta": "Operar tableros o dispositivos restringidos", "sancion": "Suspensión", "fundamento": "Capítulo Quinto – 32: Uso de equipos conforme a indicaciones y restricciones."}}, "en": {"title": "Who should work on an electrical panel marked authorized personnel only?", "text": "An employee attempts to restart equipment by opening a restricted panel.", "correct": "Only authorized and competent personnel", "options": ["Only authorized and competent personnel", "Any area leader", "Anyone if the equipment is stopped"], "explanation": "Restricted panels must not be operated by unauthorized personnel.", "impact": "Working on panels without authorization can cause electric shock, arc flash, or burns.", "rit": {"conducta": "Operating restricted panels or devices", "sancion": "Suspension", "fundamento": "Chapter Five – 32: Use equipment according to instructions and restrictions."}}, "uid": "panel_7"}, {"id": "chemical_drain", "category": "Ambiental / químicos", "rule": "Regla 5: Prevenga emisiones, derrames o contaminantes", "severity": "Alto", "visual": "drain", "es": {"title": "¿Qué regla se viola si se vierte químico en una coladera?", "text": "Después de una limpieza, alguien quiere desechar sobrante químico en una coladera.", "correct": "Prevención de emisiones, derrames o contaminantes no autorizados", "options": ["Prevención de emisiones, derrames o contaminantes no autorizados", "Reglas de estacionamiento", "Comunicación interna"], "explanation": "No se deben verter sustancias químicas en piso, coladeras o suelo.", "impact": "Verter químicos puede contaminar drenajes, suelo o agua.", "rit": {"conducta": "Verter sustancias químicas en piso, coladeras o suelo", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Séptimo – 65: Incumplimiento ambiental sancionable según gravedad."}}, "en": {"title": "What rule is violated if a chemical is poured into a drain?", "text": "After cleaning, someone wants to dispose of leftover chemical in a drain.", "correct": "Prevention of unauthorized emissions, spills, or contaminants", "options": ["Prevention of unauthorized emissions, spills, or contaminants", "Parking rules", "Internal communication"], "explanation": "Chemicals must not be poured onto floors, drains, or soil.", "impact": "Pouring chemicals can contaminate drains, soil, or water.", "rit": {"conducta": "Pouring chemicals onto floors, drains, or soil", "sancion": "Suspension or termination", "fundamento": "Chapter Seven – 65: Environmental noncompliance may be sanctioned depending on severity."}}, "uid": "chemical_drain_8"}, {"id": "running", "category": "Conductas de riesgo", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Medio", "visual": "running", "es": {"title": "¿Por qué correr dentro de la planta es una conducta insegura?", "text": "Un colaborador corre por un pasillo para llegar rápido a su estación.", "correct": "Porque aumenta el riesgo de caídas, golpes o incidentes con tránsito interno", "options": ["Porque aumenta el riesgo de caídas, golpes o incidentes con tránsito interno", "Porque afecta únicamente la imagen del área", "Porque solo está permitido correr en turno nocturno"], "explanation": "Correr dentro de instalaciones es una conducta de riesgo.", "impact": "Correr aumenta la posibilidad de caídas, choques con peatones o equipos.", "rit": {"conducta": "Correr dentro de instalaciones / no respetar señalización", "sancion": "Llamada de Atención (Gradual)", "fundamento": "Capítulo Quinto – 37: Abstenerse de actos que pongan en peligro la seguridad."}}, "en": {"title": "Why is running inside the plant an unsafe behavior?", "text": "An employee runs through a hallway to get to their station quickly.", "correct": "Because it increases the risk of falls, impacts, or incidents with internal traffic", "options": ["Because it increases the risk of falls, impacts, or incidents with internal traffic", "Because it only affects the image of the area", "Because running is only allowed on night shift"], "explanation": "Running inside facilities is a risk behavior.", "impact": "Running increases the likelihood of falls, collisions with pedestrians, or equipment incidents.", "rit": {"conducta": "Running inside facilities / not respecting signage", "sancion": "Progressive warning", "fundamento": "Chapter Five – 37: Refrain from acts that may endanger safety."}}, "uid": "running_9"}, {"id": "restricted", "category": "Señalización / áreas restringidas", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Medio", "visual": "restricted", "es": {"title": "¿Qué debe hacerse si un área está acordonada o marcada como restringida?", "text": "Una persona quiere cruzar por un área restringida para cortar camino.", "correct": "Respetar la señalización y no ingresar sin autorización", "options": ["Respetar la señalización y no ingresar sin autorización", "Entrar rápido si no hay nadie trabajando", "Mover la cinta si estorba el paso"], "explanation": "La señalización y áreas restringidas existen para controlar riesgos.", "impact": "Entrar a zonas restringidas puede exponerte a energía, químicos o trabajos no controlados.", "rit": {"conducta": "No respetar señalización o áreas restringidas", "sancion": "Llamada de Atención ( ark the area, and follow the applicable procedure", "Clean it quietly to avoid problems", "Wait to see if someone else reports it"], "explanation": "Every spill must be reported and marked immediately.", "impact": "An unmarked spill can cause falls, chemical exposure, or environmental contamination.", "rit": {"conducta": "Not immediately reporting or marking spills", "sancion": "Progressive warning or suspension", "fundamento": "Chapter Seven – 65: Noncompliance with quality and environmental procedures may result in sanctions depending on severity."}}, "uid": "spill_16"}, {"id": "procedure", "category": "Procedimientos / entrenamiento", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Alto", "visual": "procedure", "es": {"title": "¿Cuál es el riesgo de modificar un procedimiento sin autorización?", "text": "Un operador cambia un paso del procedimiento porque considera que ahorra tiempo.", "correct": "Puede generar una desviación, un riesgo de seguridad o un incumplimiento", "options": ["Puede generar una desviación, un riesgo de seguridad o un incumplimiento", "No pasa nada si el resultado final es el mismo", "Es aceptable si la persona tiene experiencia"], "explanation": "Los cambios deben validarse formalmente. La experiencia no autoriza modificar procedimientos por cuenta propia.", "impact": "Un cambio no validado puede generar errores de proceso, desviaciones, riesgos de seguridad o hallazgos de auditoría.", "rit": {"conducta": "Modificar procedimientos sin autorización", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Quinto – 37: Abstenerse de actos que pongan en peligro la seguridad o instalaciones."}}, "en": {"title": "What is the risk of modifying a procedure without authorization?", "text": "An operator changes one procedure step because they believe it saves time.", "correct": "It can create a deviation, safety risk, or compliance issue", "options": ["It can create a deviation, safety risk, or compliance issue", "Nothing happens if the final result is the same", "It is acceptable if the person has experience"], "explanation": "Changes must be formally validated. Experience does not authorize changing procedures independently.", "impact": "An unvalidated change can cause process errors, deviations, safety risks, or audit findings.", "rit": {"conducta": "Changing procedures without authorization", "sancion": "Suspension or termination", "fundamento": "Chapter Five – 37: Refrain from acts that may endanger safety or facilities."}}, "uid": "procedure_17"}, {"id": "panel", "category": "Dispositivos / equipo restringido", "rule": "Regla 2: Utilice siempre los dispositivos de seguridad", "severity": "Alto", "visual": "panel", "es": {"title": "¿Quién debe intervenir un tablero eléctrico marcado como solo personal autorizado?", "text": "Un colaborador intenta reiniciar un equipo abriendo un tablero restringido.", "correct": "Únicamente personal autorizado y competente", "options": ["Únicamente personal autorizado y competente", "Cualquier líder de área", "Cualquier persona si el equipo está detenido"], "explanation": "Los tableros restringidos no deben ser operados por personal no autorizado.", "impact": "Intervenir tableros sin autorización puede provocar choque eléctrico, arco eléctrico o quemaduras.", "rit": {"conducta": "Operar tableros o dispositivos restringidos", "sancion": "Suspensión", "fundamento": "Capítulo Quinto – 32: Uso de equipos conforme a indicaciones y restricciones."}}, "en": {"title": "Who should work on an electrical panel marked authorized personnel only?", "text": "An employee attempts to restart equipment by opening a restricted panel.", "correct": "Only authorized and competent personnel", "options": ["Only authorized and competent personnel", "Any area leader", "Anyone if the equipment is stopped"], "explanation": "Restricted panels must not be operated by unauthorized personnel.", "impact": "Working on panels without authorization can cause electric shock, arc flash, or burns.", "rit": {"conducta": "Operating restricted panels or devices", "sancion": "Suspension", "fundamento": "Chapter Five – 32: Use equipment according to instructions and restrictions."}}, "uid": "panel_18"}, {"id": "chemical_drain", "category": "Ambiental / químicos", "rule": "Regla 5: Prevenga emisiones, derrames o contaminantes", "severity": "Alto", "visual": "drain", "es": {"title": "¿Qué regla se viola si se vierte químico en una coladera?", "text": "Después de una limpieza, alguien quiere desechar sobrante químico en una coladera.", "correct": "Prevención de emisiones, derrames o contaminantes no autorizados", "options": ["Prevención de emisiones, derrames o contaminantes no autorizados", "Reglas de estacionamiento", "Comunicación interna"], "explanation": "No se deben verter sustancias químicas en piso, coladeras o suelo.", "impact": "Verter químicos puede contaminar drenajes, suelo o agua.", "rit": {"conducta": "Verter sustancias químicas en piso, coladeras o suelo", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Séptimo – 65: Incumplimiento ambiental sancionable según gravedad."}}, "en": {"title": "What rule is violated if a chemical is poured into a drain?", "text": "After cleaning, someone wants to dispose of leftover chemical in a drain.", "correct": "Prevention of unauthorized emissions, spills, or contaminants", "options": ["Prevention of unauthorized emissions, spills, or contaminants", "Parking rules", "Internal communication"], "explanation": "Chemicals must not be poured onto floors, drains, or soil.", "impact": "Pouring chemicals can contaminate drains, soil, or water.", "rit": {"conducta": "Pouring chemicals onto floors, drains, or soil", "sancion": "Suspension or termination", "fundamento": "Chapter Seven – 65: Environmental noncompliance may be sanctioned depending on severity."}}, "uid": "chemical_drain_19"}, {"id": "running", "category": "Conductas de riesgo", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Medio", "visual": "running", "es": {"title": "¿Por qué correr dentro de la planta es una conducta insegura?", "text": "Un colaborador corre por un pasillo para llegar rápido a su estación.", "correct": "Porque aumenta el riesgo de caídas, golpes o incidentes con tránsito interno", "options": ["Porque aumenta el riesgo de caídas, golpes o incidentes con tránsito interno", "Porque afecta únicamente la imagen del área", "Porque solo está permitido correr en turno nocturno"], "explanation": "Correr dentro de instalaciones es una conducta de riesgo.", "impact": "Correr aumenta la posibilidad de caídas, choques con peatones o equipos.", "rit": {"conducta": "Correr dentro de instalaciones / no respetar señalización", "sancion": "Llamada de Atención (Gradual)", "fundamento": "Capítulo Quinto – 37: Abstenerse de actos que pongan en peligro la seguridad."}}, "en": {"title": "Why is running inside the plant an unsafe behavior?", "text": "An employee runs through a hallway to get to their station quickly.", "correct": "Because it increases the risk of falls, impacts, or incidents with internal traffic", "options": ["Because it increases the risk of falls, impacts, or incidents with internal traffic", "Because it only affects the image of the area", "Because running is only allowed on night shift"], "explanation": "Running inside facilities is a risk behavior.", "impact": "Running increases the likelihood of falls, collisions with pedestrians, or equipment incidents.", "rit": {"conducta": "Running inside facilities / not respecting signage", "sancion": "Progressive warning", "fundamento": "Chapter Five – 37: Refrain from acts that may endanger safety."}}, "uid": "running_20"}, {"id": "restricted", "category": "Señalización / áreas restringidas", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Medio", "visual": "restricted", "es": {"title": "¿Qué debe hacerse si un área está acordonada o marcada como restringida?", "text": "Una persona quiere cruzar por un área restringida para adura y corte son trabajos de alto riesgo y requieren autorización formal.", "impact": "Soldar sin control puede provocar incendios, quemaduras o explosiones.", "rit": {"conducta": "Trabajo de alto riesgo sin autorización escrita", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Quinto – 40: Seguir instrucciones de Seguridad e Higiene."}}, "en": {"title": "What document/control is required before starting welding or cutting?", "text": "A contractor wants to start welding to finish before the end of the shift.", "correct": "Life safety permit / written authorization", "options": ["Life safety permit / written authorization", "An informal WhatsApp message", "Only a visual area check"], "explanation": "Welding and cutting are high-risk jobs and require formal authorization.", "impact": "Uncontrolled welding can cause fires, burns, or explosions.", "rit": {"conducta": "High-risk work without written authorization", "sancion": "Suspension or termination", "fundamento": "Chapter Five – 40: Follow Safety and Hygiene instructions."}}, "uid": "welding_22"}, {"id": "forklift_license", "category": "Conductas de riesgo", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Crítico", "visual": "forklift", "es": {"title": "¿Qué debe pasar si alguien intenta operar un montacargas sin licencia vigente?", "text": "Un colaborador quiere mover material urgente con un montacargas, pero no cuenta con licencia vigente.", "correct": "Detener la actividad y solicitar apoyo de personal autorizado", "options": ["Detener la actividad y solicitar apoyo de personal autorizado", "Permitirlo si solo será por unos minutos", "Pedirle que maneje despacio y termine rápido"], "explanation": "La operación de equipo motorizado requiere licencia y autorización. La urgencia no elimina el riesgo ni sustituye el entrenamiento.", "impact": "Un equipo motorizado mal operado puede causar atropellamientos, golpes graves, daños a producto o lesiones incapacitantes.", "rit": {"conducta": "Operar equipo motorizado sin licencia", "sancion": "Rescisión inmediata", "fundamento": "Capítulo Quinto – 37: Todo trabajador deberá abstenerse de actos que puedan poner en peligro su propia seguridad, la de sus compañeros o los bienes e instalaciones de la empresa."}}, "en": {"title": "What should happen if someone tries to operate a forklift without a valid license?", "text": "An employee wants to move urgent material with a forklift but does not have a valid license.", "correct": "Stop the activity and request support from authorized personnel", "options": ["Stop the activity and request support from authorized personnel", "Allow it if it will only take a few minutes", "Ask them to drive slowly and finish quickly"], "explanation": "Powered equipment operation requires a valid license and authorization. Urgency does not remove the risk or replace training.", "impact": "Improper operation can cause runovers, serious injuries, product damage, or disabling injuries.", "rit": {"conducta": "Operating powered equipment without a license", "sancion": "Immediate termination", "fundamento": "Chapter Five – 37: Workers must refrain from acts that could endanger their own safety, coworkers, or company assets and facilities."}}, "uid": "forklift_license_23"}, {"id": "machine_guard", "category": "Dispositivos de seguridad", "rule": "Regla 2: Utilice siempre los dispositivos de seguridad", "severity": "Crítico", "visual": "machineGuard", "es": {"title": "¿Cuál sería la mejor decisión si una máquina tiene una guarda removida?", "text": "La máquina está funcionando, pero una guarda de seguridad fue retirada para acelerar el proceso.", "correct": "No operar el equipo hasta que la guarda esté instalada y funcional", "options": ["No operar el equipo hasta que la guarda esté instalada y funcional", "Continuar mientras el operador tenga cuidado", "Usar guantes como sustituto de la guarda"], "explanation": "Nunca se debe operar maquinaria sin sus dispositivos de seguridad instalados y funcionales.", "impact": "Una guarda removida puede exponer manos, brazos o cuerpo a atrapamientos, cortes o amputaciones.", "rit": {"conducta": "Remover guardas de seguridad de maquinaria/equipo", "sancion": "Rescisión directa", "fundamento": "Capítulo Quinto – 32: Los trabajadores deben usar equipos y accesorios de protección en la forma indicada, sin alterar o dañar instrumentos de trabajo."}}, "en": {"title": "What is the best decision if a machine has a guard removed?", "text": "The machine is running, but a safety guard was removed to speed up the process.", "correct": "Do not operate the equipment until the guard is installed and functional", "options": ["Do not operate the equipment until the guard is installed and functional", "Continue as long as the operator is careful", "Use gloves as a substitute for the guard"], "explanation": "Machinery must never be operated without its safety devices installed and functional.", "impact": "A removed guard can expose hands, arms, or the body to entanglement, cuts, or amputations.", "rit": {"conducta": "Removing machine/equipment safety guards", "sancion": "Direct termination", "fundamento": "Chapter Five – 32: Workers must use protective equipment and work instruments as instructed and must not alter or damage them."}}, "uid": "machine_guard_24"}, {"id": "loto", "category": "Energías peligrosas / LOTO", "rule": "Regla 3: Siga medidas para energías peligrosas", "severity": "Crítico", "visual": "loto", "es": {"title": "¿Qué control crítico debe aplicarse antes de intervenir un equipo con energía peligrosa?", "text": "Un técnico necesita abrir un equipo para hacer un ajuste rápido.", "correct": "Aplicar bloqueo y etiquetado LOTO antes de intervenir", "options": ["Aplicar bloqueo y etiquetado LOTO antes de intervenir", "Avisar verbalmente que nadie toque el equipo", "Hacerlo rápido mientras el equipo está detenido"], "explanation": "Las energías peligrosas deben controlarse mediante LOTO. Un aviso verbal no sustituye el bloqu ciones."}}, "en": {"title": "Who should work on an electrical panel marked authorized personnel only?", "text": "An employee attempts to restart equipment by opening a restricted panel.", "correct": "Only authorized and competent personnel", "options": ["Only authorized and competent personnel", "Any area leader", "Anyone if the equipment is stopped"], "explanation": "Restricted panels must not be operated by unauthorized personnel.", "impact": "Working on panels without authorization can cause electric shock, arc flash, or burns.", "rit": {"conducta": "Operating restricted panels or devices", "sancion": "Suspension", "fundamento": "Chapter Five – 32: Use equipment according to instructions and restrictions."}}, "uid": "panel_29"}, {"id": "chemical_drain", "category": "Ambiental / químicos", "rule": "Regla 5: Prevenga emisiones, derrames o contaminantes", "severity": "Alto", "visual": "drain", "es": {"title": "¿Qué regla se viola si se vierte químico en una coladera?", "text": "Después de una limpieza, alguien quiere desechar sobrante químico en una coladera.", "correct": "Prevención de emisiones, derrames o contaminantes no autorizados", "options": ["Prevención de emisiones, derrames o contaminantes no autorizados", "Reglas de estacionamiento", "Comunicación interna"], "explanation": "No se deben verter sustancias químicas en piso, coladeras o suelo.", "impact": "Verter químicos puede contaminar drenajes, suelo o agua.", "rit": {"conducta": "Verter sustancias químicas en piso, coladeras o suelo", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Séptimo – 65: Incumplimiento ambiental sancionable según gravedad."}}, "en": {"title": "What rule is violated if a chemical is poured into a drain?", "text": "After cleaning, someone wants to dispose of leftover chemical in a drain.", "correct": "Prevention of unauthorized emissions, spills, or contaminants", "options": ["Prevention of unauthorized emissions, spills, or contaminants", "Parking rules", "Internal communication"], "explanation": "Chemicals must not be poured onto floors, drains, or soil.", "impact": "Pouring chemicals can contaminate drains, soil, or water.", "rit": {"conducta": "Pouring chemicals onto floors, drains, or soil", "sancion": "Suspension or termination", "fundamento": "Chapter Seven – 65: Environmental noncompliance may be sanctioned depending on severity."}}, "uid": "chemical_drain_30"}, {"id": "running", "category": "Conductas de riesgo", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Medio", "visual": "running", "es": {"title": "¿Por qué correr dentro de la planta es una conducta insegura?", "text": "Un colaborador corre por un pasillo para llegar rápido a su estación.", "correct": "Porque aumenta el riesgo de caídas, golpes o incidentes con tránsito interno", "options": ["Porque aumenta el riesgo de caídas, golpes o incidentes con tránsito interno", "Porque afecta únicamente la imagen del área", "Porque solo está permitido correr en turno nocturno"], "explanation": "Correr dentro de instalaciones es una conducta de riesgo.", "impact": "Correr aumenta la posibilidad de caídas, choques con peatones o equipos.", "rit": {"conducta": "Correr dentro de instalaciones / no respetar señalización", "sancion": "Llamada de Atención (Gradual)", "fundamento": "Capítulo Quinto – 37: Abstenerse de actos que pongan en peligro la seguridad."}}, "en": {"title": "Why is running inside the plant an unsafe behavior?", "text": "An employee runs through a hallway to get to their station quickly.", "correct": "Because it increases the risk of falls, impacts, or incidents with internal traffic", "options": ["Because it increases the risk of falls, impacts, or incidents with internal traffic", "Because it only affects the image of the area", "Because running is only allowed on night shift"], "explanation": "Running inside facilities is a risk behavior.", "impact": "Running increases the likelihood of falls, collisions with pedestrians, or equipment incidents.", "rit": {"conducta": "Running inside facilities / not respecting signage", "sancion": "Progressive warning", "fundamento": "Chapter Five – 37: Refrain from acts that may endanger safety."}}, "uid": "running_31"}, {"id": "restricted", "category": "Señalización / áreas restringidas", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Medio", "visual": "restricted", "es": {"title": "¿Qué debe hacerse si un área está acordonada o marcada como restringida?", "text": "Una persona quiere cruzar por un área restringida para cortar camino.", "correct": "Respetar la señalización y no ingresar sin autorización", "options": ["Respetar la señalización y no ingresar sin autorización", "Entrar rápido si no hay nadie trabajando", "Mover la cinta si estorba el paso"], "explanation": "La señalización y áreas restringidas existen para controlar riesgos.", "impact": "Entrar a zonas restringidas puede exponerte a energía, químicos o trabajos no controlados.", "rit": {"conducta": "No respetar señalización o áreas restringidas", "sancion": "Llamada de Atención (Gradual)", "fundamento": "Capítulo Quinto – 39/37: Respetar indicaciones para prevención de accidentes."}}, "en": {"title": "What should be done if an area is taped off or marked as restricted?", "text": "Someone wants to cross through a restricted area to take a shortcut.", "correct": "Respect the signage and do not enter without authorization", "options": ["Respect the signage and do not enter without authorization", "Enter quickly if no one is working there", "Move the tape if it blocks the way"], "explanation": "Signage and restricted areas exist to control risks.", "impact": "Entering restricted areas can expose you to energy, chemicals, or uncontrolled work.", "rit": {"conducta": "Not respecting signage or restricted areas", "sancion": "Progressive warning", "fundamento": "Chapter Five – 39/37: Respect accident prevention instructions."}}, "uid": "restricted_32"}, {"id": "welding", "category": "Permisos de seguridad de vida", "rule": "Regla 4: Nunca viole permisos de seguridad de vida", "severity": "Crítico", "visual": "welding", "es": {"title": "¿Qué documento/control se requiere antes de iniciar soldadura o corte?", "text": "Un proveedor quiere iniciar soldadura para terminar antes del cierre del turno.", "correct": "Permiso de seguridad de vida/autorización por escrito", "options": ["Permiso de seguridad de vida/autorización por escrito", "Un mensaje informal por WhatsApp", "Solo una revisión visual del área"], "explanation": "La soldadura y corte son trabajos de alto riesgo y requieren autorización formal.", "impact": "Soldar sin control puede provocar incendios, quemaduras o explosiones.", "rit": {"conducta": "Trabajo de alto riesgo sin autorización escrita", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Quinto – 40: Seguir instrucciones de Seguridad e Higiene."}}, "en": {"title": "What document/control is required before starting welding or cutting?", "text": "A contractor wants to start welding to finish before the end of the shift.", "correct": "Life safety permit / written authorization", "options": ["Life safety permit / written authorization", "An informal WhatsApp message", "Only a visual area check"], "explanation": "Welding and cutting are high-risk jobs and require formal authorization.", "impact": "Uncontrolled welding can cause fires, burns, or explosions.", "rit": {"conducta": "High-risk work without written authorization", "sancion": "Suspension or termination", "fundamento": "Chapter Five – 40: Follow Safety and Hygiene instructions."}}, "uid": "welding_33"}, {"id": "forklift_license", "category": "Conductas de riesgo", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Crítico", "visual": "forklift", "es": {"title": "¿Qué debe pasar si alguien intenta operar un montacargas sin licencia vigente?", "text": "Un colaborador quiere mover material urgente con un montacargas, pero no cuenta con licencia vigente.", "correct": "Detener la actividad y solicitar apoyo de personal autorizado", "options": ["Detener la actividad y solicitar apoyo de personal autorizado", "Permitirlo si solo será por unos minutos", "Pedirle que maneje despacio y termine rápido"], "explanation": "La operación de equipo motorizado requiere licencia y autorización. La urgencia no elimina el riesgo ni sustituye el entrenamiento.", "impact": "Un equipo motorizado mal operado puede causar atropellamientos, golpes graves, daños a producto o lesiones incapacitantes.", "rit": {"conducta": "Operar equipo motorizado sin licencia", "sancion": "Rescisión inmediata", "fundamento": "Capítulo Quinto – 37: Todo trabajador deberá abstenerse de actos que puedan poner en peligro su propia seguridad, la de sus compañeros o los bienes e instalaciones de la empresa."}}, "en": {"title": "What should happen if someone tries to operate a forklift without a valid license?", "text": "An employee wants to move urgent material with a forklift but does not have a valid license.", "correct": "Stop the activity and request support from authorized personnel", "options": ["Stop the activity and request support from authorized personnel", "Allow it if it will only take a few minutes", "Ask them to drive slowly and finish quickly"], "explanation": "Powered equipment operation requires a valid license and authorization. Urgency does not remove the risk or replace training.", "impact": "Improper operation can cause runovers, serious injuries, product damage, or disabling injuries.", "rit": {"conducta": "Operating powered equipment without a license", "sancion": "Immediate termination", "fundamento": "Chapter Five – 37: Workers must refrain from acts that could endanger their own safety, coworkers, or company assets and facilities."}}, "uid": "forklift_license_34"}, {"id": "machine_guard", "category": "Dispositivos de seguridad", "rule": "Regla 2: Utilice siempre los dispositivos de seguridad", "severity": "Crítico", "visual": "machineGuard", "es": {"title": "¿Cuál sería la mejor decisión si una máquina tiene una guarda removida?", "text": "La máquina está funcionando, pero una guarda de seguridad fue retirada para acelerar el proceso.", "correct": "No operar el equipo hasta que la guarda esté instalada y funcional", "options": ["No operar el equipo hasta que la guarda esté instalada y funcional", "Continuar mientras el operador tenga cuidado", "Usar guantes como sustituto de la guarda"], "explanation": "Nunca se debe operar maquinaria sin sus dispositivos de seguridad instalados y funcionales.", "impact": "Una guarda removida puede exponer manos, brazos o cuerpo a atrapamientos, cortes o amputaciones.", "rit": {"conducta": "Remover guardas de seguridad de maquinaria/equipo", "sancion": "Rescisión directa", "fundamento": "Capítulo Quinto – 32: Los trabajadores deben usar equipos y accesorios de protección en la forma indicada, sin alterar o dañar instrumentos de trabajo."}}, "en": {"title": "What is the best decision if a machine has a guard removed?", "text": "The machine is running, but a safety guard was removed to speed up the process.", "correct": "Do not operate the equipment until the guard is installed and functional", "options": ["Do not operate the equipment until the guard is installed and functional", "Continue as long as the operator is careful", "Use gloves as a substitute for the guard"], "explanation": "Machinery must never be operated without its safety devices installed and functional.", "impact": "A removed guard can expose hands, arms, or the body to entanglement, cuts, or amputations.", "rit": {"conducta": "Removing machine/equipment safety guards", "sancion": "Direct termination", "fundamento": "Chapter Five – 32: Workers must use protective equipment and work instruments as instructed and must not alter or damage them."}}, "uid": "machine_guard_35"}, {"id": "loto", "category": "Energías peligrosas / LOTO", "rule": "Regla 3: Siga medidas para energías peligrosas", "severity": "Crítico", "visual": "loto" thout authorization", "Enter quickly if no one is working there", "Move the tape if it blocks the way"], "explanation": "Signage and restricted areas exist to control risks.", "impact": "Entering restricted areas can expose you to energy, chemicals, or uncontrolled work.", "rit": {"conducta": "Not respecting signage or restricted areas", "sancion": "Progressive warning", "fundamento": "Chapter Five – 39/37: Respect accident prevention instructions."}}, "uid": "restricted_43"}, {"id": "welding", "category": "Permisos de seguridad de vida", "rule": "Regla 4: Nunca viole permisos de seguridad de vida", "severity": "Crítico", "visual": "welding", "es": {"title": "¿Qué documento/control se requiere antes de iniciar soldadura o corte?", "text": "Un proveedor quiere iniciar soldadura para terminar antes del cierre del turno.", "correct": "Permiso de seguridad de vida/autorización por escrito", "options": ["Permiso de seguridad de vida/autorización por escrito", "Un mensaje informal por WhatsApp", "Solo una revisión visual del área"], "explanation": "La soldadura y corte son trabajos de alto riesgo y requieren autorización formal.", "impact": "Soldar sin control puede provocar incendios, quemaduras o explosiones.", "rit": {"conducta": "Trabajo de alto riesgo sin autorización escrita", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Quinto – 40: Seguir instrucciones de Seguridad e Higiene."}}, "en": {"title": "What document/control is required before starting welding or cutting?", "text": "A contractor wants to start welding to finish before the end of the shift.", "correct": "Life safety permit / written authorization", "options": ["Life safety permit / written authorization", "An informal WhatsApp message", "Only a visual area check"], "explanation": "Welding and cutting are high-risk jobs and require formal authorization.", "impact": "Uncontrolled welding can cause fires, burns, or explosions.", "rit": {"conducta": "High-risk work without written authorization", "sancion": "Suspension or termination", "fundamento": "Chapter Five – 40: Follow Safety and Hygiene instructions."}}, "uid": "welding_44"}, {"id": "forklift_license", "category": "Conductas de riesgo", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Crítico", "visual": "forklift", "es": {"title": "¿Qué debe pasar si alguien intenta operar un montacargas sin licencia vigente?", "text": "Un colaborador quiere mover material urgente con un montacargas, pero no cuenta con licencia vigente.", "correct": "Detener la actividad y solicitar apoyo de personal autorizado", "options": ["Detener la actividad y solicitar apoyo de personal autorizado", "Permitirlo si solo será por unos minutos", "Pedirle que maneje despacio y termine rápido"], "explanation": "La operación de equipo motorizado requiere licencia y autorización. La urgencia no elimina el riesgo ni sustituye el entrenamiento.", "impact": "Un equipo motorizado mal operado puede causar atropellamientos, golpes graves, daños a producto o lesiones incapacitantes.", "rit": {"conducta": "Operar equipo motorizado sin licencia", "sancion": "Rescisión inmediata", "fundamento": "Capítulo Quinto – 37: Todo trabajador deberá abstenerse de actos que puedan poner en peligro su propia seguridad, la de sus compañeros o los bienes e instalaciones de la empresa."}}, "en": {"title": "What should happen if someone tries to operate a forklift without a valid license?", "text": "An employee wants to move urgent material with a forklift but does not have a valid license.", "correct": "Stop the activity and request support from authorized personnel", "options": ["Stop the activity and request support from authorized personnel", "Allow it if it will only take a few minutes", "Ask them to drive slowly and finish quickly"], "explanation": "Powered equipment operation requires a valid license and authorization. Urgency does not remove the risk or replace training.", "impact": "Improper operation can cause runovers, serious injurie .", "impact": "A removed guard can expose hands, arms, or the body to entanglement, cuts, or amputations.", "rit": {"conducta": "Removing machine/equipment safety guards", "sancion": "Direct termination", "fundamento": "Chapter Five – 32: Workers must use protective equipment and work instruments as instructed and must not alter or damage them."}}, "uid": "machine_guard_46"}, {"id": "loto", "category": "Energías peligrosas / LOTO", "rule": "Regla 3: Siga medidas para energías peligrosas", "severity": "Crítico", "visual": "loto", "es": {"title": "¿Qué control crítico debe aplicarse antes de intervenir un equipo con energía peligrosa?", "text": "Un técnico necesita abrir un equipo para hacer un ajuste rápido.", "correct": "Aplicar bloqueo y etiquetado LOTO antes de intervenir", "options": ["Aplicar bloqueo y etiquetado LOTO antes de intervenir", "Avisar verbalmente que nadie toque el equipo", "Hacerlo rápido mientras el equipo está detenido"], "explanation": "Las energías peligrosas deben controlarse mediante LOTO. Un aviso verbal no sustituye el bloqueo físico.", "impact": "No controlar energía peligrosa puede causar electrocución, atrapamiento, quemaduras o lesiones fatales.", "rit": {"conducta": "Realizar actividades con energías peligrosas sin aplicar LOTO", "sancion": "Rescisión inmediata", "fundamento": "Capítulo Octavo – 82-i: Negarse a adoptar medidas preventivas o seguir procedimientos para evitar accidentes o enfermedades profesionales."}}, "en": {"title": "What critical control must be applied before servicing equipment with hazardous energy?", "text": "A technician needs to open equipment to perform a quick adjustment.", "correct": "Apply Lockout/Tagout before servicing", "options": ["Apply Lockout/Tagout before servicing", "Verbally tell others not to touch the equipment", "Do it quickly while the equipment is stopped"], "explanation": "Hazardous energy must be controlled through LOTO. A verbal warning does not replace physical lockout.", "impact": "Failure to control hazardous energy can cause electrocution, entrapment, burns, or fatal injuries.", "rit": {"conducta": "Working with hazardous energy without applying LOTO", "sancion": "Immediate termination", "fundamento": "Chapter Eight – 82-i: Refusing to adopt preventive measures or follow procedures to avoid workplace accidents or occupational illnesses."}}, "uid": "loto_47"}, {"id": "height", "category": "Permisos de seguridad de vida", "rule": "Regla 4: Nunca viole permisos de seguridad de vida", "severity": "Crítico", "visual": "height", "es": {"title": "¿Qué falta si alguien realiza un trabajo en altura sin permiso escrito?", "text": "Un proveedor sube a una escalera para reparar una luminaria, pero no existe permiso visible ni revisión previa.", "correct": "Falta autorización formal para un trabajo de alto riesgo", "options": ["Falta autorización formal para un trabajo de alto riesgo", "Solo falta que alguien lo esté observando", "No falta nada si el trabajo dura poco"], "explanation": "Los trabajos en altura requieren permiso, controles definidos y EPP adecuado.", "impact": "Una caída de altura puede generar lesiones graves, incapacidad permanente o fatalidad.", "rit": {"conducta": "Realizar trabajos de alto riesgo sin autorización escrita", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Quinto – 40: Es obligatorio sujetarse a las instrucciones de la Comisión de Seguridad e Higiene."}}, "en": {"title": "What is missing if someone performs work at heights without written authorization?", "text": "A contractor climbs a ladder to repair a light fixture, but there is no visible permit or prior review.", "correct": "Formal authorization for high-risk work is missing", "options": ["Formal authorization for high-risk work is missing", "Only someone watching is missing", "Nothing is missing if the task is short"], "explanation": "Work at heights requires a permit, defined controls, and proper PPE.", "impact": "A fall from height can cause serious injury, permanent disability, or fatality.", "rit": {"conducta": "Performing high-risk work without written authorization", "sancion": "Suspension or termination", "fundamento": "Chapter Five – 40: Workers must follow instructions issued by the Safety and Hygiene Commission."}}, "uid": "height_48"}, {"id": "spill", "category": "Ambiental / derrames", "rule": "Regla 5: Prevenga emisiones, derrames o contaminantes", "severity": "Alto", "visual": "spill", "es": {"title": "¿Qué acción es correcta ante un derrame en piso?", "text": "Se derrama líquido en un área de tránsito y una persona cree que puede limpiarlo sin reportarlo.", "correct": "Reportar, señalizar y seguir el procedimiento aplicable", "options": ["Reportar, señalizar y seguir el procedimiento aplicable", "Limpiarlo en silencio para evitar problemas", "Esperar a ver si alguien más lo reporta"], "explanation": "Todo derrame debe reportarse y señalizarse inmediatamente.", "impact": "Un derrame no señalizado puede provocar caídas, exposición química o contaminación ambiental.", "rit": {"conducta": "No reportar o señalizar inmediatamente derrames", "sancion": "Llamada de Atención (Gradual) o suspensión", "fundamento": "Capítulo Séptimo – 65: Incumplimiento a procedimientos de calidad y ambiental puede generar sanciones según gravedad."}}, "en": {"title": "What is the correct action when there is a spill on the floor?", "text": "A liquid spills in a traffic area and someone thinks they can clean it up without reporting it.", "correct": "Report it, mark the area, and follow the applicable procedure", "options": ["Report it, mark the area, and follow the applicable procedure", "Clean it quietly to avoid problems", "Wait to see if someone else reports it"], "explanation": "Every spill must be reported and marked immediately.", "impact": "An unmarked spill can cause falls, chemical exposure, or environmental contamination.", "rit": {"conducta": "Not immediately reporting or marking spills", "sancion": "Progressive warning mination", "fundamento": "Chapter Five – 37: Refrain from acts that may endanger safety or facilities."}}, "uid": "procedure_50"}];

function postToSheet(payload){
  return fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    keepalive: true,
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(payload)
  }).catch(err => {
    console.warn("Sheet post failed", err);
    throw err;
  });
}

function fetchSheet(type){
  return new Promise((resolve) => {
    const sheetMap = {
      individual: "Individual",
      torneo: "Torneo",
      respuestas: "Respuestas"
    };
    const sheetName = sheetMap[type] || type;
    const callbackName = "gvizCallback_" + type + "_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    const script = document.createElement("script");

    window[callbackName] = function(response){
      try {
        const table = response && response.table ? response.table : null;
        if(!table || !table.cols || !table.rows){
          resolve([]);
          return;
        }

        const headers = table.cols.map((c, i) => {
          return String(c.label || c.id || ("col" + i)).trim();
        });

        const rows = table.rows.map(r => {
          const item = {};
          headers.forEach((h, i) => {
            const cell = r.c && r.c[i] ? r.c[i] : null;
            item[h] = cell ? (cell.f !== undefined ? cell.f : cell.v) : "";
          });
          return item;
        }).filter(row => Object.values(row).some(v => String(v || "").trim() !== ""));

        resolve(rows);
      } catch(err) {
        console.warn("GViz parse failed", type, err);
        resolve([]);
      } finally {
        delete window[callbackName];
        if(script && script.parentNode) script.parentNode.removeChild(script);
      }
    };

    script.onerror = function(){
      console.warn("GViz read failed", type);
      delete window[callbackName];
      if(script && script.parentNode) script.parentNode.removeChild(script);
      resolve([]);
    };

    script.src = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${callbackName}&t=${Date.now()}`;
    document.body.appendChild(script);
  });
}

async function refreshRemoteData(){
  const [individual, torneo, respuestas] = await Promise.all([
    fetchSheet("individual"),
    fetchSheet("torneo"),
    fetchSheet("respuestas")
  ]);

function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
}

function setRecognitionStatus(type, message){
  const status = document.getElementById("recognitionStatus");
  if(!status) return;

  status.style.display = "block";
  status.classList.remove("status-success","status-error","status-loading");

  if(type === "loading") status.classList.add("status-loading");
  if(type === "success") status.classList.add("status-success");
  if(type === "error") status.classList.add("status-error");

  status.textContent = message;
}

function sendRecognitionByEmail(name, email){
  const safeName = String(name)
    .trim()
    .replace(/[^\w\sáéíóúÁÉÍÓÚñÑ-]/g,"")
    .replace(/\s+/g,"_");

  return postToSheet({
    type: "reconocimiento",
    version: CLIENT_VERSION || "HTML_JPEG_ONLY_V2",
    requestedFormat: "jpg",
    name,
    email,
    filename: `Reconocimiento_Reglas_Cardinales_${safeName}_JPEG_V1.jpg`
  });
}

function isMobileDevice(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
}

async function generateRecognitionAndEmail(){
  const nameInput = document.getElementById("recognitionNameInput");
  const emailInput = document.getElementById("recognitionEmailInput");
  const err = document.getElementById("recognitionError");
  const btn = document.getElementById("recognitionGenerateBtn");

  const name = nameInput ? nameInput.value.trim() : "";
  const email = emailInput ? emailInput.value.trim() : "";

  if(!name || !isValidEmail(email)){
    if(err) err.style.display = "block";
    setRecognitionStatus("error", t("recognitionError") || (currentLang==="es"?"❌ Captura nombre y correo electrónico para continuar.":"❌ Enter name and email address to continue."));
    return;
  }

  if(err) err.style.display = "none";

  if(btn){
    btn.disabled = true;
    btn.textContent = currentLang==="es" ? "Enviando..." : "Sending...";
  }

  setRecognitionStatus("loading", t("recognitionSending") || (currentLang==="es"?"⏳ Enviando reconocimiento, por favor espera...":"⏳ Sending recognition, please wait..."));

  try {
    console.log("Sending recognition payload", {
      type: "reconocimiento",
      version: CLIENT_VERSION || "HTML_JPEG_ONLY_V2",
      requestedFormat: "jpg",
      name,
      email
    });

    await sendRecognitionByEmail(name, email);

    setRecognitionStatus("success", t("recognitionReady") || (currentLang==="es"?"✅ Reconocimiento enviado correctamente. El correo puede tardar unos segundos en llegar.":"✅ Recognition sent successfully. The email may take a few seconds to arrive."));

    if(nameInput) nameInput.value = "";
    if(emailInput) emailInput.value = "";

  } catch(error){
    console.error("Recognition send error:", error);
    setRecognitionStatus("error", currentLang==="es"?"❌ No se pudo enviar el reconocimiento. Revisa la conexión e intenta nuevamente.":"❌ The recognition could not be sent. Check the connection and try again.");

  } finally {
    if(btn){
      btn.disabled = false;
      btn.textContent = t("recognitionGenerate") || (currentLang==="es"?"Enviar reconocimiento por email":"Send recognition by email");
    }
  }
}

function normalizeKey(value){
  return String(value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g,"");
}
function getCell(row, names){
  if(!row) return "";

  if(!Array.isArray(row) && typeof row === "object"){
    const keys = Object.keys(row);
    for(const target of names){
      const cleanTarget = normalizeKey(target);
      const match = keys.find(k => normalizeKey(k) === cleanTarget);
      if(match !== undefined) return row[match];
    }
  }

  return "";
}
function normalizeIndividualRows(rows){
  return (Array.isArray(rows)?rows:[]).map(r=>({
    name:getCell(r,["nombre","name","participante","vaquero"]),
    score:Number(getCell(r,["score","puntaje"]) || 0),
    max:Number(getCell(r,["max","maximo","máximo"]) || 5),
    percent:Number(getCell(r,["porcentaje","percent"]) || 0),
    time:getCell(r,["tiempo","time"]),
    badge:getCell(r,["rango","badge"]),
    criticalErrors:Number(getCell(r,["erroresCriticos","errores críticos","criticalErrors","critical errors"]) || 0),
    commitment:getCell(r,["compromiso","commitment"]),
    date:getCell(r,["fecha","Fecha","date","Date"])
  })).filter(x=>x.name || x.score);
}
function normalizeTeamRows(rows){
  return (Array.isArray(rows)?rows:[]).map(r=>({
    team1:getCell(r,["equipo1","Equipo1","team1","equipo 1"]),
    team2:getCell(r,["equipo2","Equipo2","team2","equipo 2"]),
    team1Score:Number(getCell(r,["score1","Score1","team1Score","puntaje1","score equipo 1"]) || 0),
    team2Score:Number(getCell(r,["score2","Score2","team2Score","puntaje2","score equipo 2"]) || 0),
    winner:getCell(r,["ganador","Ganador","winner"]),
    date:getCell(r,["fecha","Fecha","date","Date"])
  })).filter(x=>x.team1 || x.team2 || x.winner);
}
function normalizeAnswerRows(rows){
  return (Array.isArray(rows)?rows:[]).map(r=>{
    const rawCorrect = getCell(r,["correcta","Correcta","correct","correcto"]);
    return {
      category:getCell(r,["categoria","categoría","Categoria","category"]),
      rule:getCell(r,["regla","Regla","rule"]),
      severity:getCell(r,["severidad","Severidad","severity"]),
      correct:String(rawCorrect).trim().toLowerCase()==="true" || rawCorrect===true || String(rawCorrect).trim().toLowerCase()==="verdadero" || String(rawCorrect).trim()==="1",
      date:getCell(r,["fecha","Fecha","date","Date"])
    };
  }).filter(x=>x.category);
}

function renderHRBoard(){
  const at=document.getElementById("accuracyTitle");
  if(at) at.textContent=t("accuracyTitle");
  const ot=document.getElementById("opportunityTitle");
  if(ot) ot.textContent=t("opportunityTitle");

  const logs=getAnswerLogs();
  const agg={};

  logs.forEach(x=>{
    const k=x.category || x.rule || (currentLang==="es"?"Sin categoría":"Uncategorized");
    agg[k]=agg[k]||{total:0,correct:0};
    agg[k].total++;
    if(x.correct) agg[k].correct++;
  });

  const arr=Object.entries(agg).map(([topic,v])=>{
    const acc=v.total?Math.round(v.correct/v.total*100):0;
    return{topic,total:v.total,correct:v.correct,accuracy:acc,opportunity:100-acc};
  });

  const render=(data,type)=>data.length?data.map(x=>{
    const val=type==="accuracy"?x.accuracy:x.opportunity;
    return`<div class="hr-chart-row"><div class="hr-chart-label">${x.topic}<br><small>${t("totalAnswers")}: ${x.total}</small></div><div class="hr-bar-track"><div class="hr-bar ${type==="opportunity"?"opportunity":""}" style="width:${val}%"></div></div><div class="hr-chart-value">${val}%<br><small>${x.correct}/${x.total}</small></div></div>`;
  }).join(""):`<div class="detail-item center">${t("noRegistered")}</div>`;

  const a=[...arr].sort((x,y)=>y.accuracy-x.accuracy||y.total-x.total);
  const o=[...arr].sort((x,y)=>y.opportunity-x.opportunity||y.total-x.total);
  const accuracyHtml=render(a,"accuracy");
  const opportunityHtml=render(o,"opportunity");

  ["accuracyChart","accuracyChartCombined"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.innerHTML=accuracyHtml;
  });

  ["opportunityChart","opportunityChartCombined"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.innerHTML=opportunityHtml;
  });
}

function bonus(s){return s<=30?2:s<=60?1:0}function badge(percent,total,crit){if(crit>0)return"⚠️ "+(currentLang==="es"?"Riesgo Crítico – No Aprobado":"Critical Risk – Not Approved");if(percent>=90&&total>=6)return"🤠 "+(currentLang==="es"?"Sheriff de Seguridad":"Safety Sheriff");if(percent>=75)return"🐎 "+t("cowboyStrong");return"🪶 "+(currentLang==="es"?"Aprendiz del Oeste":"Old West Apprentice")}
function calculateProjectedBoardRank(entry){
  let board=[];
  try{
    board=getScores().map(x=>({...x}));
  }catch(err){
    board=[];
  }

  board.push(entry);
  board.sort((a,b)=>{
    const scoreDiff=Number(b.score||0)-Number(a.score||0);
    if(scoreDiff!==0) return scoreDiff;
    return Number(a.seconds||999999)-Number(b.seconds||999999);
  });

  const idx=board.findIndex(x=>
    x.name===entry.name &&
    Number(x.score||0)===Number(entry.score||0) &&
    Number(x.seconds||0)===Number(entry.seconds||0) &&
    String(x.date||"")===String(entry.date||"")
  );

  return idx>=0 ? idx+1 : board.length;
}

function getRankMessage(place){
  if(currentLang==="es"){
    if(place===1) return "🥇 ¡Vas en 1er lugar del tablero!";
    if(place===2) return "🥈 Vas en 2do lugar del tablero.";
    if(place===3) return "🥉 Vas en 3er lugar del tablero.";
    return `🏆 Vas en el lugar #${place} del tablero.`;
  }
  if(place===1) return "🥇 You are in 1st place on the board!";
  if(place===2) return "🥈 You are in 2nd place on the board.";
  if(place===3) return "🥉 You are in 3rd place on the board.";
  return `🏆 You are in place #${place} on the board.`;
}
function finishGame(){
  let raw=score;
  let max=questionCount;
  let percent=Math.round(raw/max*100);
  let time=formatTime(elapsedSeconds);
  let b=bonus(elapsedSeconds);
  let rank=badge(percent,raw+b,criticalErrors);
  let msg=percent>=90?t("sheriffExpert"):percent>=75?t("cowboyStrong"):t("tryAgain");

  const entry={
    name:participantName,
    score:raw,
    max,
    percent,
    seconds:elapsedSeconds,
    time,
    badge:rank,
    criticalErrors,
    commitment:selectedCommitment,
    date:new Date().toLocaleString("es-MX")
  };

  const boardPlace=calculateProjectedBoardRank(entry);

  document.getElementById("finalMessage").textContent=msg;
  document.getElementById("finalBadge").textContent=rank;
  document.getElementById("finalLead").textContent=`${participantName}, ${raw}/${max} · ${getRankMessage(boardPlace)}`;
  document.getElementById("finalPercent").textContent=percent+"%";
  document.getElementById("finalScenario").textContent=`#${boardPlace}`;
  document.getElementById("finalTime").textContent=time;

  const rankingLabel=currentLang==="es"?"Lugar en tablero":"Board ranking";
  const duelLabel=document.getElementById("duelsWonLabel");
  if(duelLabel) duelLabel.textContent=rankingLabel;

  document.getElementById("finalCommitment").innerHTML=`<strong>${t("commitmentChosen")}</strong><br>${selectedCommitment}${criticalErrors>0?`<div class="critical-warning">⚠️ ${criticalErrors} ${t("criticalWarn")}</div>`:""}`;

  document.getElementById("finalBonus").innerHTML=`<div class="bonus-detail"><div>${t("baseScore")}<br><strong>${raw}/${max}</strong></div><div>${t("bonus")}<br><strong>+${b}</strong></div><div>${rankingLabel}<br><strong>#${boardPlace}</strong></div></div>`;

  saveScore(entry);
  showScreen("final");
  renderTopThree();
}

/* =========================
   Safe initial render
========================= */
function initializeApp(){
  try{
    console.log("Loaded", CLIENT_VERSION, API_URL);

    if(typeof applyLanguage === "function") applyLanguage();
    if(typeof renderTopThree === "function") renderTopThree();

    // Cargar datos remotos después del primer render para no dejar la pantalla vacía.
    if(typeof refreshRemoteData === "function"){
      refreshRemoteData()
        .then(() => {
          if(typeof renderTopThree === "function") renderTopThree();
          if(typeof renderLeaderboard === "function") renderLeaderboard();
          if(typeof renderHRBoard === "function") renderHRBoard();
        })
        .catch(err => console.warn("Initial remote refresh failed:", err));
    }

    if(typeof startAutoRefresh === "function") startAutoRefresh();

    if(currentQuestions.length){
      const scenario=document.getElementById("scenarioScreen");
      if(scenario && !scenario.classList.contains("hidden") && typeof renderQuestion === "function"){
        renderQuestion();
      }
    }
  }catch(error){
    console.error("Initial render failed:", error);
  }
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", initializeApp);
}else{
  initializeApp();
}

window.addEventListener("load", () => {
  const home=document.getElementById("homeScreen");
  const mainTitle=document.getElementById("mainTitle");

  // Fallback: si por algún motivo no se llenó el texto, reintenta el render.
  if(home && mainTitle && !String(mainTitle.textContent || "").trim()){
    initializeApp();
  }
});
