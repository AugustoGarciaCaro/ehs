/* Saloon Play Modal */
.saloon-modal {
  position: relative;
  overflow: hidden;
  text-align: center;
  background:
    radial-gradient(circle at center, rgba(255,247,237,.96), rgba(254,215,170,.96)),
    linear-gradient(135deg,#fff7ed,#fed7aa);
}

.saloon-modal:before,
.saloon-modal:after {
  content: "";
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;
  background:
    linear-gradient(90deg, rgba(59,29,11,.92), rgba(124,45,18,.86)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 18px);
  border: 4px solid #3b1d0b;
  z-index: 0;
  animation-duration: .7s;
  animation-fill-mode: forwards;
  animation-timing-function: ease-out;
}

.saloon-modal:before {
  left: 0;
  transform-origin: left center;
  animation-name: saloonLeft;
}

.saloon-modal:after {
  right: 0;
  transform-origin: right center;
  animation-name: saloonRight;
}

.saloon-content {
  position: relative;
  z-index: 2;
  padding: 12px;
}

.saloon-sign {
  display: inline-block;
  background: #7c2d12;
  color: #fff7ed;
  border: 3px dashed #f2c078;
  border-radius: 18px;
  padding: 12px 22px;
  font-weight: 950;
  letter-spacing: 2px;
  text-transform: uppercase;
  box-shadow: 0 10px 24px rgba(59,29,11,.28);
  margin-bottom: 16px;
}

.saloon-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 24px 0 14px;
}

.saloon-action {
  min-height: 145px;
  border-radius: 24px;
  font-size: 18px;
  white-space: normal;
}

.saloon-action span {
  display: block;
  font-size: 42px;
  margin-bottom: 8px;
}

@keyframes saloonLeft {
  0% { transform: perspective(800px) rotateY(0deg); opacity: 1; }
  100% { transform: perspective(800px) rotateY(-72deg); opacity: .18; }
}

@keyframes saloonRight {
  0% { transform: perspective(800px) rotateY(0deg); opacity: 1; }
  100% { transform: perspective(800px) rotateY(72deg); opacity: .18; }
}

@media(max-width:700px){
  .saloon-actions { grid-template-columns: 1fr; }
  .saloon-action { min-height: 115px; }
}

@media(max-width:900px){.hero,.options,.grid,.stats,.bonus-detail,.tournament-panel,.tournament-score{grid-template-columns:1fr}.nav{justify-content:center}.brand{text-align:center}.visual{aspect-ratio:4/3}.leaderboard{min-width:850px}}
@media(max-width:480px){.container{padding:22px 12px 42px}button{width:100%}h1{font-size:40px}.visual{aspect-ratio:1/1}.visual-tag{left:12px;right:12px;text-align:center}.visual-label{left:12px;right:12px}}
</style>

hts without written authorization? — Scenario 15", "text": "A contractor climbs a ladder to repair a light fixture, but there is no visible permit or prior review.", "correct": "Formal authorization for high-risk work is missing", "options": ["Formal authorization for high-risk work is missing", "Only someone watching is missing", "Nothing is missing if the task is short"], "explanation": "Work at heights requires a permit, defined controls, and proper PPE.", "impact": "A fall from height can cause serious injury, permanent disability, or fatality.", "rit": {"conducta": "Performing high-risk work without written authorization", "sancion": "Suspension or termination", "fundamento": "Chapter Five – 40: Workers must follow instructions issued by the Safety and Hygiene Commission."}}, "uid": "height_15"}, {"id": "spill", "category": "Ambiental / derrames", "rule": "Regla 5: Prevenga emisiones, derrames o contaminantes", "severity": "Alto", "visual": "spill", "es": {"title": "¿Qué acción es correcta ante un derrame en piso? — Escenario 16", "text": "Se derrama líquido en un área de tránsito y una persona cree que puede limpiarlo sin reportarlo.", "correct": "Reportar, señalizar y seguir el procedimiento aplicable", "options": ["Reportar, señalizar y seguir el procedimiento aplicable", "Limpiarlo en silencio para evitar problemas", "Esperar a ver si alguien más lo reporta"], "explanation": "Todo derrame debe reportarse y señalizarse inmediatamente.", "impact": "Un derrame no señalizado puede provocar caídas, exposición química o contaminación ambiental.", "rit": {"conducta": "No reportar o señalizar inmediatamente derrames", "sancion": "Llamada de Atención (Gradual) o suspensión", "fundamento": "Capítulo Séptimo – 65: Incumplimiento a procedimientos de calidad y ambiental puede generar sanciones según gravedad."}}, "en": {"title": "What is the correct action when there is a spill on the floor? — Scenario 16", "text": "A liquid spills in a traffic area and someone thinks they can clean it up without reporting it.", "correct": "Report it, mark the area, and follow the applicable procedure", "options": ["Report it, mark the area, and follow the applicable procedure", "Clean it quietly to avoid problems", "Wait to see if someone else reports it"], "explanation": "Every spill must be reported and marked immediately.", "impact": "An unmarked spill can cause falls, chemical exposure, or environmental contamination.", "rit": {"conducta": "Not immediately reporting or marking spills", "sancion": "Progressive warning or suspension", "fundamento": "Chapter Seven – 65: Noncompliance with quality and environmental procedures may result in sanctions depending on severity."}}, "uid": "spill_16"}, {"id": "procedure", "category": "Procedimientos / entrenamiento", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Alto", "visual": "procedure", "es": {"title": "¿Cuál es el riesgo de modificar un procedimiento sin autorización? — Escenario 17", "text": "Un operador cambia un paso del procedimiento porque considera que ahorra tiempo.", "correct": "Puede generar una desviación, un riesgo de seguridad o un incumplimiento", "options": ["Puede generar una desviación, un riesgo de seguridad o un incumplimiento", "No pasa nada si el resultado final es el mismo", "Es aceptable si la persona tiene experiencia"], "explanation": "Los cambios deben validarse formalmente. La experiencia no autoriza modificar procedimientos por cuenta propia.", "impact": "Un cambio no validado puede generar errores de proceso, desviaciones, riesgos de seguridad o hallazgos de auditoría.", "rit": {"conducta": "Modificar procedimientos sin autorización", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Quinto – 37: Abstenerse de actos que pongan en peligro la seguridad o instalaciones."}}, "en": {"title": "What is the risk of modifying a procedure without authorization? — Scenario 17", "text": "An operator changes one procedure step because they believe it saves time.", "correct": "It can create a deviation, safety risk, or compliance issue", "options": ["It can create a deviation, safety risk, or compliance issue", "Nothing happens if the final result is the same", "It is acceptable if the person has experience"], "explanation": "Changes must be formally validated. Experience does not authorize changing procedures independently.", "impact": "An unvalidated change can cause process errors, deviations, safety risks, or audit findings.", "rit": {"conducta": "Changing procedures without authorization", "sancion": "Suspension or termination", "fundamento": "Chapter Five – 37: Refrain from acts that may endanger safety or facilities."}}, "uid": "procedure_17"}, {"id": "panel", "category": "Dispositivos / equipo restringido", "rule": "Regla 2: Utilice siempre los dispositivos de seguridad", "severity": "Alto", "visual": "panel", "es": {"title": "¿Quién debe intervenir un tablero eléctrico marcado como solo personal autorizado? — Escenario 18", "text": "Un colaborador intenta reiniciar un equipo abriendo un tablero restringido.", "correct": "Únicamente personal autorizado y competente", "options": ["Únicamente personal autorizado y competente", "Cualquier líder de área", "Cualquier persona si el equipo está detenido"], "explanation": "Los tableros restringidos no deben ser operados por personal no autorizado.", "impact": "Intervenir tableros sin autorización puede provocar choque eléctrico, arco eléctrico o quemaduras.", "rit": {"conducta": "Operar tableros o dispositivos restringidos", "sancion": "Suspensión", "fundamento": "Capítulo Quinto – 32: Uso de equipos conforme a indicaciones y restricciones."}}, "en": {"title": "Who should work on an electrical panel marked authorized personnel only? — Scenario 18", "text": "An employee attempts to restart equipment by opening a restricted panel.", "correct": "Only authorized and competent personnel", "options": ["Only authorized and competent personnel", "Any area leader", "Anyone if the equipment is stopped"], "explanation": "Restricted panels must not be operated by unauthorized personnel.", "impact": "Working on panels without authorization can cause electric shock, arc flash, or burns.", "rit": {"conducta": "Operating restricted panels or devices", "sancion": "Suspension", "fundamento": "Chapter Five – 32: Use equipment according to instructions and restrictions."}}, "uid": "panel_18"}, {"id": "chemical_drain", "category": "Ambiental / químicos", "rule": "Regla 5: Prevenga emisiones, derrames o contaminantes", "severity": "Alto", "visual": "drain", "es": {"title": "¿Qué regla se viola si se vierte químico en una coladera? — Escenario 19", "text": "Después de una limpieza, alguien quiere desechar sobrante químico en una coladera.", "correct": "Prevención de emisiones, derrames o contaminantes no autorizados", "options": ["Prevención de emisiones, derrames o contaminantes no autorizados", "Reglas de estacionamiento", "Comunicación interna"], "explanation": "No se deben verter sustancias químicas en piso, coladeras o suelo.", "impact": "Verter químicos puede contaminar drenajes, suelo o agua.", "rit": {"conducta": "Verter sustancias químicas en piso, coladeras o suelo", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Séptimo – 65: Incumplimiento ambiental sancionable según gravedad."}}, "en": {"title": "What rule is violated if a chemical is poured into a drain? — Scenario 19", "text": "After cleaning, someone wants to dispose of leftover chemical in a drain.", "correct": "Prevention of unauthorized emissions, spills, or contaminants", "options": ["Prevention of unauthorized emissions, spills, or contaminants", "Parking rules", "Internal communication"], "explanation": "Chemicals must not be poured onto floors, drains, or soil.", "impact": "Pouring chemicals can contaminate drains, soil, or water.", "rit": {"conducta": "Pouring chemicals onto floors, drains, or soil", "sancion": "Suspension or termination", "fundamento": "Chapter Seven – 65: Environmental noncompliance may be sanctioned depending on severity."}}, "uid": "chemical_drain_19"}, {"id": "running", "category": "Conductas de riesgo", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Medio", "visual": "running", "es": {"title": "¿Por qué correr dentro de la planta es una conducta insegura? — Escenario 20", "text": "Un colaborador corre por un pasillo para llegar rápido a su estación.", "correct": "Porque aumenta el riesgo de caídas, golpes o incidentes con tránsito interno", "options": ["Porque aumenta el riesgo de caídas, golpes o incidentes con tránsito interno", "Porque afecta únicamente la imagen del área", "Porque solo está permitido correr en turno nocturno"], "explanation": "Correr dentro de instalaciones es una conducta de riesgo.", "impact": "Correr aumenta la posibilidad de caídas, choques con peatones o equipos.", "rit": {"conducta": "Correr dentro de instalaciones / no respetar señalización", "sancion": "Llamada de Atención (Gradual)", "fundamento": "Capítulo Quinto – 37: Abstenerse de actos que pongan en peligro la seguridad."}}, "en": {"title": "Why is running inside the plant an unsafe behavior? — Scenario 20", "text": "An employee runs through a hallway to get to their station quickly.", "correct": "Because it increases the risk of falls, impacts, or incidents with internal traffic", "options": ["Because it increases the risk of falls, impacts, or incidents with internal traffic", "Because it only affects the image of the area", "Because running is only allowed on night shift"], "explanation": "Running inside facilities is a risk behavior.", "impact": "Running increases the likelihood of falls, collisions with pedestrians, or equipment incidents.", "rit": {"conducta": "Running inside facilities / not respecting signage", "sancion": "Progressive warning", "fundamento": "Chapter Five – 37: Refrain from acts that may endanger safety."}}, "uid": "running_20"}, {"id": "restricted", "category": "Señalización / áreas restringidas", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Medio", "visual": "restricted", "es": {"title": "¿Qué debe hacerse si un área está acordonada o marcada como restringida? — Escenario 21", "text": "Una persona quiere cruzar por un área restringida para cortar camino.", "correct": "Respetar la señalización y no ingresar sin autorización", "options": ["Respetar la señalización y no ingresar sin autorización", "Entrar rápido si no hay nadie trabajando", "Mover la cinta si estorba el paso"], "explanation": "La señalización y áreas restringidas existen para controlar riesgos.", "impact": "Entrar a zonas restringidas puede exponerte a energía, químicos o trabajos no controlados.", "rit": {"conducta": "No respetar señalización o áreas restringidas", "sancion": "Llamada de Atención (Gradual)", "fundamento": "Capítulo Quinto – 39/37: Respetar indicaciones para prevención de accidentes."}}, "en": {"title": "What should be done if an area is taped off or marked as restricted? — Scenario 21", "text": "Someone wants to cross through a restricted area to take a shortcut.", "correct": "Respect the signage and do not enter without authorization", "options": ["Respect the signage and do not enter without authorization", "Enter quickly if no one is working there", "Move the tape if it blocks the way"], "explanation": "Signage and restricted areas exist to control risks.", "impact": "Entering restricted areas can expose you to energy, chemicals, or uncontrolled work.", "rit": {"conducta": "Not respecting signage or restricted areas", "sancion": "Progressive warning", "fundamento": "Chapter Five – 39/37: Respect accident prevention instructions."}}, "uid": "restricted_21"}, {"id": "welding", "category": "Permisos de seguridad de vida", "rule": "Regla 4: Nunca viole permisos de seguridad de vida", "severity": "Crítico", "visual": "welding", "es": {"title": "¿Qué documento/control se requiere antes de iniciar soldadura o corte? — Escenario 22", "text": "Un proveedor quiere iniciar soldadura para terminar antes del cierre del turno.", "correct": "Permiso de seguridad de vida/autorización por escrito", "options": ["Permiso de seguridad de vida/autorización por escrito", "Un mensaje informal por WhatsApp", "Solo una revisión visual del área"], "explanation": "La soldadura y corte son trabajos de alto riesgo y requieren autorización formal.", "impact": "Soldar sin control puede provocar incendios, quemaduras o explosiones.", "rit": {"conducta": "Trabajo de alto riesgo sin autorización escrita", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Quinto – 40: Seguir instrucciones de Seguridad e Higiene."}}, "en": {"title": "What document/control is required before starting welding or cutting? — Scenario 22", "text": "A contractor wants to start welding to finish before the end of the shift.", "correct": "Life safety permit / written authorization", "options": ["Life safety permit / written authorization", "An informal WhatsApp message", "Only a visual area check"], "explanation": "Welding and cutting are high-risk jobs and require formal authorization.", "impact": "Uncontrolled welding can cause fires, burns, or explosions.", "rit": {"conducta": "High-risk work without written authorization", "sancion": "Suspension or termination", "fundamento": "Chapter Five – 40: Follow Safety and Hygiene instructions."}}, "uid": "welding_22"}, {"id": "forklift_license", "category": "Conductas de riesgo", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Crítico", "visual": "forklift", "es": {"title": "¿Qué debe pasar si alguien intenta operar un montacargas sin licencia vigente? — Escenario 23", "text": "Un colaborador quiere mover material urgente con un montacargas, pero no cuenta con licencia vigente.", "correct": "Detener la actividad y solicitar apoyo de personal autorizado", "options": ["Detener la actividad y solicitar apoyo de personal autorizado", "Permitirlo si solo será por unos minutos", "Pedirle que maneje despacio y termine rápido"], "explanation": "La operación de equipo motorizado requiere licencia y autorización. La urgencia no elimina el riesgo ni sustituye el entrenamiento.", "impact": "Un equipo motorizado mal operado puede causar atropellamientos, golpes graves, daños a producto o lesiones incapacitantes.", "rit": {"conducta": "Operar equipo motorizado sin licencia", "sancion": "Rescisión inmediata", "fundamento": "Capítulo Quinto – 37: Todo trabajador deberá abstenerse de actos que puedan poner en peligro su propia seguridad, la de sus compañeros o los bienes e instalaciones de la empresa."}}, "en": {"title": "What should happen if someone tries to operate a forklift without a valid license? — Scenario 23", "text": "An employee wants to move urgent material with a forklift but does not have a valid license.", "correct": "Stop the activity and request support from authorized personnel", "options": ["Stop the activity and request support from authorized personnel", "Allow it if it will only take a few minutes", "Ask them to drive slowly and finish quickly"], "explanation": "Powered equipment operation requires a valid license and authorization. Urgency does not remove the risk or replace training.", "impact": "Improper operation can cause runovers, serious injuries, product damage, or disabling injuries.", "rit": {"conducta": "Operating powered equipment without a license", "sancion": "Immediate termination", "fundamento": "Chapter Five – 37: Workers must refrain from acts that could endanger their own safety, coworkers, or company assets and facilities."}}, "uid": "forklift_license_23"}, {"id": "machine_guard", "category": "Dispositivos de seguridad", "rule": "Regla 2: Utilice siempre los dispositivos de seguridad", "severity": "Crítico", "visual": "machineGuard", "es": {"title": "¿Cuál sería la mejor decisión si una máquina tiene una guarda removida? — Escenario 24", "text": "La máquina está funcionando, pero una guarda de seguridad fue retirada para acelerar el pro plimiento", "options": ["Puede generar una desviación, un riesgo de seguridad o un incumplimiento", "No pasa nada si el resultado final es el mismo", "Es aceptable si la persona tiene experiencia"], "explanation": "Los cambios deben validarse formalmente. La experiencia no autoriza modificar procedimientos por cuenta propia.", "impact": "Un cambio no validado puede generar errores de proceso, desviaciones, riesgos de seguridad o hallazgos de auditoría.", "rit": {"conducta": "Modificar procedimientos sin autorización", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Quinto – 37: Abstenerse de actos que pongan en peligro la seguridad o instalaciones."}}, "en": {"title": "What is the risk of modifying a procedure without authorization? — Scenario 28", "text": "An operator changes one procedure step because they believe it saves time.", "correct": "It can create a deviation, safety risk, or compliance issue", "options": ["It can create a deviation, safety risk, or compliance issue", "Nothing happens if the final result is the same", "It is acceptable if the person has experience"], "explanation": "Changes must be formally validated. Experience does not authorize changing procedures independently.", "impact": "An unvalidated change can cause process errors, deviations, safety risks, or audit findings.", "rit": {"conducta": "Changing procedures without authorization", "sancion": "Suspension or termination", "fundamento": "Chapter Five – 37: Refrain from acts that may endanger safety or facilities."}}, "uid": "procedure_28"}, {"id": "panel", "category": "Dispositivos / equipo restringido", "rule": "Regla 2: Utilice siempre los dispositivos de seguridad", "severity": "Alto", "visual": "panel", "es": {"title": "¿Quién debe intervenir un tablero eléctrico marcado como solo personal autorizado? — Escenario 29", "text": "Un colaborador intenta reiniciar un equipo abriendo un tablero restringido.", "correct": "Únicamente personal autorizado y competente", "options": ": "Verter sustancias químicas en piso, coladeras o suelo", "sancion": "Suspensión o rescisión", "fundamento": "Capítulo Séptimo – 65: Incumplimiento ambiental sancionable según gravedad."}}, "en": {"title": "What rule is violated if a chemical is poured into a drain? — Scenario 30", "text": "After cleaning, someone wants to dispose of leftover chemical in a drain.", "correct": "Prevention of unauthorized emissions, spills, or contaminants", "options": ["Prevention of unauthorized emissions, spills, or contaminants", "Parking rules", "Internal communication"], "explanation": "Chemicals must not be poured onto floors, drains, or soil.", "impact": "Pouring chemicals can contaminate drains, soil, or water.", "rit": {"conducta": "Pouring chemicals onto floors, drains, or soil", "sancion": "Suspension or termination", "fundamento": "Chapter Seven – 65: Environmental noncompliance may be sanctioned depending on severity."}}, "uid": "chemical_drain_30"}, {"id": "running", "category": "Conductas de riesgo", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Medio", "visual": "running", "es": {"title": "¿Por qué correr dentro de la planta es una conducta insegura? — Escenario 31", "text": "Un colaborador corre por un pasillo para llegar rápido a su estación.", "correct": "Porque aumenta el riesgo de caídas, golpes o incidentes con tránsito interno", "options": ["Porque aumenta el riesgo de caídas, golpes o incidentes con tránsito interno", "Porque afecta únicamente la imagen del área", "Porque solo está permitido correr en turno nocturno"], "explanation": "Correr dentro de instalaciones es una conducta de riesgo.", "impact": "Correr aumenta la posibilidad de caídas, choques con peatones o equipos.", "rit": {"conducta": "Correr dentro de instalaciones / no respetar señalización", "sancion": "Llamada de Atención (Gradual)", "fundamento": "Capítulo Quinto – 37: Abstenerse de actos que pongan en peligro la seguridad."}}, "en": {"title": "Why is running inside the plant an unsafe behavior? — Scenario 31", "text": "An employee runs through a hallway to get to their station quickly.", "correct": "Because it increases the risk of falls, impacts, or incidents with internal traffic", "options": ["Because it increases the risk of falls, impacts, or incidents with internal traffic", "Because it only affects the image of the area", "Because running is only allowed on night shift"], "explanation": "Running inside facilities is a risk behavior.", "impact": "Running increases the likelihood of falls, collisions with pedestrians, or equipment incidents.", "rit": {"conducta": "Running inside facilities / not respecting signage", "sancion": "Progressive warning", "fundamento": "Chapter Five – 37: Refrain from acts that may endanger safety."}}, "uid": "running_31"}, {"id": "restricted", "category": "Señalización / áreas restringidas", "rule": "Regla 1: Evite conductas de riesgo", "severity": "Medio", "visual": "restricted", "es": {"title": "¿Qué debe hacerse si un área está acordonada o marcada como restringida? — Escenario 32", "text": "Una persona quiere cruzar por un área restringida para cortar camino.", "correct": "Respetar la señalización y no ingresar sin autorización", "options": ["Respetar la señalización y no ingresar sin autorización", "Entrar rápido si no hay nadie trabajando", "Mover la cinta si estorba el paso"], "explanation": "La señalización y áreas restringidas existen para controlar riesgos.", "impact": "Entrar a zonas restringidas puede exponerte a energía, químicos o trabajos no controlados.", "rit": {"conducta": "No respetar señalización o áreas restringidas", "sancion": "Llamada de Atención (Gradual)", "fundamento": "Capítulo Quinto – 39/37: Respetar indicaciones para prevención de accidentes."}}, "en": {"title": "What should be done if an area is taped off or marked as restricted? — Scenario 32", "text": "Someone wants to cross through a restricted area to take a shortcut.", "correct": "Respect the signage and do not enter ator is careful", "Use gloves as a substitute for the guard"], "explanation": "Machinery must never be operated without its safety devices installed and functional.", "impact": "A removed guard can expose hands, arms, or the body to entanglement, cuts, or amputations.", "rit": {"conducta": "Removing machine/equipment safety guards", "sancion": "Direct termination", "fundamento": "Chapter Five – 32: Workers must use protective equipment and work instruments as instructed and must not alter or damage them."}}, "uid": "machine_guard_35"}, {"id": "loto", "category": "Energías peligrosas / LOTO", "rule": "Regla 3: Siga medidas para energías peligrosas", "severity": "Crítico", "visual": "loto", "es": {"title": "¿Qué control crítico debe aplicarse antes de intervenir un equipo con energía peligrosa? — Escenario 36", "text": "Un técnico necesita abrir un equipo para hacer un ajuste rápido.", "correct": "Aplicar bloqueo y etiquetado LOTO antes de intervenir", "options": ["Aplicar bloqueo y etiquetado LOTO antes de intervenir", "Avisar verbalmente que nadie toque el equipo", "Hacerlo rápido mientras el equipo está detenido"], "explanation": "Las energías peligrosas deben controlarse mediante LOTO. Un aviso verbal no sustituye el bloqueo físico.", "impact": "No controlar energía peligrosa puede causar electrocución, atrapamiento, quemaduras o lesiones fatales.", "rit": {"conducta": "Realizar actividades con energías peligrosas sin aplicar LOTO", "sancion": "Rescisión inmediata", "fundamento": "Capítulo Octavo – 82-i: Negarse a adoptar medidas preventivas o seguir procedimientos para evitar accidentes o enfermedades profesionales."}}, "en": {"title": "What critical control must be applied before servicing equipment with hazardous energy? — Scenario 36", "text": "A technician needs to open equipment to perform a quick adjustment.", "correct": "Apply Lockout/Tagout before servicing", "options": ["Apply Lockout/Tagout before servicing", "Verbally tell others not to touch the equip function startGameFromModal(){
  const modalName=document.getElementById("modalParticipantName");

    if(modalName) modalName.focus();
    return;
  }
  if(err) err.style.display="none";
  const homeName=document.getElementById("participantName");
  if(homeName) homeName.value=modalName.value.trim();
  closePlayModal();
  startGame();
}

function renderCommitment(){document.getElementById("commitmentGrid").innerHTML=t("contributions").slice(0,4).map(c=>`<button class="commitment-option" onclick="selectCommitment('${c[2].replace(/'/g,"\\'")}')"><strong>${c[0]}</strong><br>${c[1]}</button>`).join("")}
function openRule(i){genericMode="rule";genericIndex=i;let r=t("rules")[i];document.getElementById("genericBadge").textContent="📜";document.getElementById("genericTitle").textContent=r[0];document.getElementById("genericLead").textContent=r[1];document.getElementById("genericContent").innerHTML=`<div class="detail-item"><strong>${t("support")}</strong>${currentLang==="es"?"El Reglamento Interior de Trabajo sustenta acciones preventivas y correctivas cuando una conducta pone en riesgo la seguridad, procedimientos o medio ambiente.":"The Internal Work Regulations support preventive and corrective action when conduct puts safety, procedures, or environment at risk."}</div><div class="detail-item"><strong>${t("sanction")}</strong>${currentLang==="es"?"Puede ir desde llamada de atención hasta suspensión, rescisión o rescisión inmediata según la gravedad.":"May range from warning to suspension, termination, or immediate termination depending on severity."}</div>`;renderGenericNav(5);document.getElementById("genericOverlay").style.display="flex"}
function openContribution(i){genericMode="contribution";genericIndex=i;let c=t("contributions")[i];document.getElementById("genericBadge").textContent="🤠";document.getElementById("genericTitle").textContent=c[0];document.getElementById("genericLead").textContent=c[1];document.getElementById("genericContent").innerHTML=c[3].map(x=>`<div class="detail-item">✔️ ${x}</div>`).join("");renderGenericNav(t("contributions").length);document.getElementById("genericOverlay").style.display="flex"}
function renderGenericNav(total){document.getElementById("genericNav").innerHTML=`<button class="btn-secondary" onclick="genericPrev()">${t("previous")}</button><button class="btn-primary" onclick="genericNext()">${genericIndex>=total-1?t("close"):t("nextItem")}</button>`}
function genericPrev(){let total=genericMode==="rule"?5:t("contributions").length;genericIndex=genericIndex<=0?total-1:genericIndex-1;genericMode==="rule"?openRule(genericIndex):openContribution(genericIndex)}
function genericNext(){let total=genericMode==="rule"?5:t("contributions").length;if(genericIndex>=total-1){closeGeneric();return}genericIndex++;genericMode==="rule"?openRule(genericIndex):openContribution(genericIndex)}
function closeGeneric(){document.getElementById("genericOverlay").style.display="none"}
function showAllChallenges(){document.getElementById("genericBadge").textContent="📜";document.getElementById("genericTitle").textContent=t("challengesTitle");document.getElementById("genericLead").textContent=t("challengesLead");document.getElementById("genericContent").innerHTML=QUESTION_BANK.map((q,i)=>`<div class="detail-item"><strong>#${i+1}</strong>${local(q,"title")} <span class="severity">${difficulty(q)}</span></div>`).join("");document.getElementById("genericNav").innerHTML="";document.getElementById("genericOverlay").style.display="flex"}
function getScores(){try{return JSON.parse(localStorage.getItem("westernRitScores")||"[]")}catch(e){return[]}}
function getTeamScores(){try{return JSON.parse(localStorage.getItem("westernTeamScores")||"[]")}catch(e){return[]}}
function getWrongLogs(){try{return JSON.parse(localStorage.getItem("westernWrongLogs")||"[]")}catch(e){return[]}}
function getAnswerLogs(){try{return JSON.parse(localStorage.getItem("westernAnswerLogs")||"[]")}catch(e){return[]}}
function saveScore(e){let s=getScores();s.push(e);s.sort((a,b)=>b.score-a.score||(a.seconds||999999)-(b.seconds||999999));localStorage.setItem("westernRitScores",JSON.stringify(s.slice(0,100)))}
function saveTeamMatch(e){let s=getTeamScores();s.push(e);localStorage.setItem("westernTeamScores",JSON.stringify(s.slice(0,100)))}
function logWrong(q){let s=getWrongLogs();s.push({category:q.category,rule:q.rule,severity:q.severity,title:q.es.title,date:new Date().toLocaleString("es-MX")});localStorage.setItem("westernWrongLogs",JSON.stringify(s.slice(-500)))}
function logAnswer(q,ok){let s=getAnswerLogs();s.push({category:q.category,correct:!!ok,date:new Date().toLocaleString("es-MX")});localStorage.setItem("westernAnswerLogs",JSON.stringify(s.slice(-1000)))}
function renderTopThree(){let s=getScores().slice(0,3);document.getElementById("homeTopThree").innerHTML=s.length?s.map((x,i)=>`<div class="top-three-item"><span>${i+1}. ${x.name}</span><span>${x.score}/${x.max} · ${x.time}</span></div>`).join(""):`<div class="top-three-item"><span>${t("noTop")}</span><span>🤠</span></div>`}
function renderLeaderboard(){let s=getScores(),body=document.getElementById("leaderboardBody");body.innerHTML=s.length?s.map((x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td>${x.score}/${x.max}</td><td>${x.time}</td><td>${x.badge}</td><td>${x.criticalErrors||0}</td><td>${x.commitment||""}</td><td>${x.date}</td></tr>`).join(""):`<tr><td colspan="8" class="center">${t("noRegistered")}</td></tr>`;let ts=getTeamScores(),tb=document.getElementById("teamLeaderboardBody");tb.innerHTML=ts.length?ts.map((x,i)=>`<tr><td>${i+1}</td><td>${x.team1} vs ${x.team2}</td><td>${x.team1Score} - ${x.team2Score}</td><td><span class="winner-badge">${x.winner}</span></td><td>${x.date}</td></tr>`).join(""):`<tr><td colspan="5" class="center">${t("noRegistered")}</td></tr>`}
function renderHRBoard(){let logs=getAnswerLogs(),agg={};logs.forEach(x=>{let k=x.category;agg[k]=agg[k]||{total:0,correct:0};agg[k].total++;if(x.correct)agg[k].correct++});let arr=Object.entries(agg).map(([topic,v])=>{let acc=v.total?Math.round(v.correct/v.total*100):0;return{topic,total:v.total,correct:v.correct,accuracy:acc,opportunity:100-acc}});let render=(data,type)=>data.length?data.map(x=>{let val=type==="accuracy"?x.accuracy:x.opportunity;return`<div class="hr-chart-row"><div class="hr-chart-label">${x.topic}<br><small>${t("totalAnswers")}: ${x.total}</small></div><div class="hr-bar-track"><div class="hr-bar ${type==="opportunity"?"opportunity":""}" style="width:${val}%"></div></div><div class="hr-chart-value">${val}%<br><small>${x.correct}/${x.total}</small></div></div>`}).join(""):`<div class="detail-item center">${t("noRegistered")}</div>`;let a=[...arr].sort((x,y)=>y.accuracy-x.accuracy||y.total-x.total),o=[...arr].sort((x,y)=>y.opportunity-x.opportunity||y.total-x.total);let ac=document.getElementById("accuracyChart"),op=document.getElementById("opportunityChart");if(ac)ac.innerHTML=render(a,"accuracy");if(op)op.innerHTML=render(o,"opportunity")}
function clearLeaderboard(){if(confirm(currentLang==="es"?"¿Seguro que deseas borrar tableros y datos RH?":"Clear boards and HR data?")){localStorage.removeItem("westernRitScores");localStorage.removeItem("westernTeamScores");localStorage.removeItem("westernWrongLogs");localStorage.removeItem("westernAnswerLogs");renderLeaderboard();renderHRBoard();renderTopThree()}}
function startGame(){let input=document.getElementById("participantName"),err=document.getElementById("nameError");if(!input.value.trim()){err.style.display="block";input.focus();return}err.style.display="none";participantName=input.value.trim();currentQuestions=shuffle(QUESTION_BANK).slice(0,questionCount).map(q=>({...q,opts:shuffle(local(q,"options"))}));currentIndex=0;score=0;answered=false;selectedCommitment="";criticalErrors=0;ritErrors=[];tournamentMode=false;showScreen("scenario");startTimer();renderQuestion()}
function startTournament(){let a=document.getElementById("team1Name").value.trim()||t("team1"),b=document.getElementById("team2Name").value.trim()||t("team2");tournamentMode=true;tournamentTurn=0;tournamentScores=[0,0];tournamentNames=[a,b];document.getElementById("team1ScoreLabel").textContent=a;document.getElementById("team2ScoreLabel").textContent=b;document.getElementById("team1Score").textContent="0";document.getElementById("team2Score").textContent="0";currentQuestions=shuffle(QUESTION_BANK).sort((x,y)=>(x.severity==="Medio"?1:x.severity==="Alto"?2:3)-(y.severity==="Medio"?1:y.severity==="Alto"?2:3)).slice(0,10).map(q=>({...q,opts:shuffle(local(q,"options"))}));currentIndex=0;score=0;answered=false;participantName=a+" vs "+b;showScreen("scenario");startTimer();renderQuestion()}
function renderQuestion(){let q=currentQuestions[currentIndex];answered=false;let total=tournamentMode?currentQuestions.length:questionCount;document.getElementById("questionCounter").textContent=tournamentMode?`${t("question")} ${currentIndex+1} / ${total} · ${tournamentNames[tournamentTurn]}`:`${t("question")} ${currentIndex+1} de ${total}`;document.getElementById("scoreText").textContent=score;document.getElementById("progressBar").style.width=((currentIndex+1)/total*100)+"%";let sev=q.severity,sevClass=sev==="Crítico"?"sev-critico":sev==="Alto"?"sev-alto":"sev-medio";document.getElementById("severityBox").innerHTML=`<div class="severity ${sevClass}">⚠️ ${t("risk")} ${sevLabel(sev)}</div><span class="difficulty-pill">${difficulty(q)}</span>`;let v=getVisual(q.visual);document.getElementById("visualBox").innerHTML=`<div class="visual-main" style="background-image:url('${v[2]}')"></div><div class="visual-label"><small>${t("postcard")}</small><strong>${v[0]}</strong></div><div class="visual-tag">${v[1]}</div>`;document.getElementById("scenarioTitle").textContent=local(q,"title");document.getElementById("scenarioText").textContent=local(q,"text");document.getElementById("optionsBox").innerHTML=q.opts.map((o,i)=>`<button class="option" data-answer="${o.replace(/"/g,"&quot;")}" onclick="selectAnswer(this)"><small>${t("answer")} ${i+1}:</small><strong>${o}</strong></button>`).join("");let fb=document.getElementById("feedbackBox");fb.style.display="none";fb.classList.remove("correct");document.getElementById("nextBtn").textContent=currentIndex===total-1?(tournamentMode?t("navTournament"):t("oath")):t("next");let banner=document.getElementById("turnBanner");banner.style.display=tournamentMode?"block":"none";if(tournamentMode){document.getElementById("turnBannerName").textContent=tournamentNames[tournamentTurn];document.getElementById("liveTeam1").textContent=tournamentNames[0];document.getElementById("liveTeam2").textContent=tournamentNames[1];document.getElementById("liveTeam1Score").textContent=tournamentScores[0];document.getElementById("liveTeam2Score").textContent=tournamentScores[1]}}
function selectAnswer(btn){if(answered)return;answered=true;let q=currentQuestions[currentIndex],ok=norm(btn.dataset.answer)===norm(local(q,"correct"));logAnswer(q,ok);if(ok){score++;if(tournamentMode){tournamentScores[tournamentTurn]++;document.getElementById("liveTeam1Score").textContent=tournamentScores[0];document.getElementById("liveTeam2Score").textContent=tournamentScores[1]}}document.querySelectorAll(".option").forEach(b=>{if(norm(b.dataset.answer)===norm(local(q,"correct")))b.classList.add("correct");if(b===btn&&!ok)b.classList.add("wrong")});document.getElementById("scoreText").textContent=score;let fb=document.getElementById("feedbackBox");fb.style.display="block";if(ok)fb.classList.add("correct");document.getElementById("feedbackTitle").textContent=ok?(currentLang==="es"?"Bien hecho, vaquero.":"Well done, cowboy."):(currentLang==="es"?"Esa decisión te metería en problemas.":"That decision would get you in trouble.");document.getElementById("feedbackText").innerHTML=`${local(q,"explanation")}<div class="impact"><strong>${t("impact")}</strong> ${local(q,"impact")}</div>`;if(!ok){logWrong(q);let r=qRit(q);if(q.severity==="Crítico")criticalErrors++;setTimeout(()=>showRitOverlay(r),250)}}
function nextQuestion(){let total=tournamentMode?currentQuestions.length:questionCount;if(tournamentMode){if(currentIndex===total-1){stopTimer();let w=tournamentScores[0]===tournamentScores[1]?(currentLang==="es"?"Empate":"Tie"):(tournamentScores[0]>tournamentScores[1]?tournamentNames[0]:tournamentNames[1]);saveTeamMatch({team1:tournamentNames[0],team2:tournamentNames[1],team1Score:tournamentScores[0],team2Score:tournamentScores[1],winner:w,date:new Date().toLocaleString("es-MX")});let status=document.getElementById("tournamentStatus");status.style.display="block";status.innerHTML=`<h3>🏆 ${t("tournamentResult")}</h3><p>${tournamentNames[0]}: ${tournamentScores[0]} · ${tournamentNames[1]}: ${tournamentScores[1]}</p><p><strong>${t("winner")}:</strong> ${w}</p>`;showScreen("tournament");tournamentMode=false;return}currentIndex++;tournamentTurn=currentIndex%2;renderQuestion();return}if(currentIndex===total-1){stopTimer();showScreen("commitment");return}currentIndex++;renderQuestion()}
function showRitOverlay(r){document.getElementById("ritBadgeText").textContent=t("ritBadge");document.getElementById("ritStopText").textContent=t("stop");document.getElementById("ritFooterText").textContent=t("ritFooter");document.getElementById("ritContent").innerHTML=`<div class="detail-item"><strong>${t("conduct")}</strong>${r.conducta}</div><div class="detail-item"><strong>${t("sanction")}</strong><span class="sanction">${r.sancion}</span></div><div class="detail-item"><strong>${t("support")}</strong>${r.fundamento}</div>`;document.getElementById("ritOverlay").style.display="flex"}
function closeRitOverlay(){document.getElementById("ritOverlay").style.display="none"}
function selectCommitment(c){selectedCommitment=c;finishGame()}
function bonus(s){return s<=30?2:s<=60?1:0}function badge(percent,total,crit){if(crit>0)return"⚠️ "+(currentLang==="es"?"Riesgo Crítico – No Aprobado":"Critical Risk – Not Approved");if(percent>=90&&total>=6)return"🤠 "+(currentLang==="es"?"Sheriff de Seguridad":"Safety Sheriff");if(percent>=75)return"🐎 "+t("cowboyStrong");return"🪶 "+(currentLang==="es"?"Aprendiz del Oeste":"Old West Apprentice")}
function finishGame(){let raw=score,max=questionCount,percent=Math.round(raw/max*100),time=formatTime(elapsedSeconds),b=bonus(elapsedSeconds),rank=badge(percent,raw+b,criticalErrors),msg=percent>=90?t("sheriffExpert"):percent>=75?t("cowboyStrong"):t("tryAgain");document.getElementById("finalMessage").textContent=msg;document.getElementById("finalBadge").textContent=rank;document.getElementById("finalLead").textContent=`${participantName}, ${raw}/${max}`;document.getElementById("finalPercent").textContent=percent+"%";document.getElementById("finalScenario").textContent=`${raw}/${max}`;document.getElementById("finalTime").textContent=time;document.getElementById("finalCommitment").innerHTML=`<strong>${t("commitmentChosen")}</strong><br>${selectedCommitment}${criticalErrors>0?`<div class="critical-warning">⚠️ ${criticalErrors} ${t("criticalWarn")}</div>`:""}`;document.getElementById("finalBonus").innerHTML=`<div class="bonus-detail"><div>${t("baseScore")}<br><strong>${raw}/${max}</strong></div><div>${t("bonus")}<br><strong>+${b}</strong></div><div>${t("rankGranted")}<br><strong>${rank}</strong></div></div>`;saveScore({name:participantName,score:raw,max,percent,seconds:elapsedSeconds,time,badge:rank,criticalErrors,commitment:selectedCommitment,date:new Date().toLocaleString("es-MX")});showScreen("final");renderTopThree()}
applyLanguage();
</script>
</body>
</html>
